services:
  sjvn_custom.security_headers_subscriber:
    class: Drupal\sjvn_custom\EventSubscriber\SecurityHeadersSubscriber
    arguments: ['@current_user']
    tags:
      - { name: event_subscriber }

  sjvn_custom.breadcrumb_builder:
    class: Drupal\sjvn_custom\Breadcrumb\SjvnNodeBreadcrumbBuilder
    arguments: ['@plugin.manager.menu.link', '@path_alias.manager', '@entity_type.manager']
    tags:
      - { name: breadcrumb_builder, priority: 10000 }

