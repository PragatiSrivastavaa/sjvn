sjvn_custom.orgchart_translate:
  path: '/admin/config/orgchart/{id}/translate'
  defaults:
    _form: '\Drupal\sjvn_custom\Form\OrgchartTranslateForm'
    _title: 'Translate Orgchart'
  requirements:
    _permission: 'translate configuration'

sjvn_custom.tender_award_loa:
  path: '/tender-award/loa/{node}'
  defaults:
    _controller: '\Drupal\sjvn_custom\Controller\TenderAwardLoaController::download'
  requirements:
    _entity_access: 'node.view'

sjvn_custom.dop_typos:
  path: '/admin/content/dop-typos'
  defaults:
    _controller: '\Drupal\sjvn_custom\Controller\DopTyposController::listTypos'
    _title: 'DOP Typo Corrections Tracking'
  requirements:
    _permission: 'access content overview'
