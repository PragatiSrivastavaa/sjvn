          content:
            value: '<div><p class="directors-message">The business of the Company is managed by a Board of Directors consisting of Whole Time Directors and Part-Time Directors. SJVN is currently headed by a Chairman and Managing Director (CMD) and Three (3) Functional Directors viz. Director (Personnel), Director (Finance) and Director (Projects). In addition, there are Two (2) Part-Time Directors representing the Government of India and Government of Himachal Pradesh. There are also Two Non-Official Part-Time Independent Directors on the Board of the Company.</p></div>'
