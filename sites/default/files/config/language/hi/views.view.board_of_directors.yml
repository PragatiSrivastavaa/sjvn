          content:
            value: '<div><p class="directors-message">कंपनी का व्यवसाय पूर्णकालिक निदेशकों और अंशकालिक निदेशकों से मिलकर बने निदेशक मंडल द्वारा प्रबंधित किया जाता है। एसजेवीएन का नेतृत्व वर्तमान में एक अध्यक्ष एवं प्रबंध निदेशक (सीएमडी) और तीन (3) कार्यात्मक निदेशक अर्थात निदेशक (कार्मिक), निदेशक (वित्त) और निदेशक (परियोजनाएं) करते हैं। इसके अलावा, भारत सरकार और हिमाचल प्रदेश सरकार का प्रतिनिधित्व करने वाले दो (2) अंशकालिक निदेशक हैं। कंपनी के बोर्ड में दो गैर-आधिकारिक अंशकालिक स्वतंत्र निदेशक भी हैं।</p></div>'
            format: full_html
