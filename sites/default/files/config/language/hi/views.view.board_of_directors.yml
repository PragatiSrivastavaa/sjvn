ir4\" aria-labelledby=\"headingFour\" data-bs-parent=\"#accordionExample\"><div class=\"accordion-body\"><table class=\"table\"><tbody><tr><td><strong>Dr. Shashikant Jagannath Wani</strong></td><td><strong>Independent Director - Chairman</strong></td></tr><tr><td><strong>Dr. Udeeta Tyagi</strong></td><td><strong>Independent Director - Member</strong></td></tr><tr><td><strong>Mr. Mohammad Afzal</strong></td><td><strong>Non-Executive Director - Member</strong></td></tr></tbody></table></div></div></div><!-- DIR 5 --><div class=\"accordion-item\"><h2 class=\"accordion-header\" id=\"headingFive\"><button class=\"accordion-button collapsed\" type=\"button\" data-bs-toggle=\"collapse\" data-bs-target=\"#dir5\" aria-expanded=\"false\" aria-controls=\"dir5\">\r\n                                                                                       Risk Management Committee\r\n                                                                                    </button></h2><div class=\"accordion-collapse collapse\" id=\"dir5\" aria-labelledby=\"headingFive\" data-bs-parent=\"#accordionExample\"><div class=\"accordion-body\"><table class=\"table\"><tbody><tr><td><strong>Dr. Shashikant Jagannath Wani</strong></td><td><strong>Independent Director - Chairman</strong></td></tr><tr><td><strong>Dr. Udeeta Tyagi</strong></td><td><strong>Independent Director - Member</strong></td></tr><tr><td><strong>Mr. Mohammad Afzal</strong></td><td><strong>Non-Executive Director - Member</strong></td></tr></tbody></table></div></div></div></div></div></div></div></section>"
