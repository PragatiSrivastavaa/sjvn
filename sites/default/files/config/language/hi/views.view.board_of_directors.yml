            value: "<section class=\"about-part\" id=\"about-part\"><div class=\"container\"><div class=\"row\"><div class=\"col-lg-9 col-12\"><h2 class=\"subtitle\">Sub-Committees of the Board</h2><p>Board of Directors has the following sub-committees The compositions of the Sub-Committees of the Board are given below:</p><div class=\"accordion\" id=\"accordionExample\"><!-- DIR 1 --><div class=\"accordion-item\"><h2 class=\"accordion-header\" id=\"headingOne\"><button class=\"accordion-button collapsed\" type=\"button\" data-bs-toggle=\"collapse\" data-bs-target=\"#dir1\" aria-expanded=\"false\" aria-controls=\"dir1\">\r\n                                                                                       Audit Committee\r\n                                                                                    </button></h2><div class=\"accordion-collapse collapse\" id=\"dir1\" aria-labelledby=\"headingOne\" data-bs-parent=\"#accordionExample\"><div class=\"accordion-body\"><table class=\"table\"><tbody><tr><td><strong>Dr. Shashikant Jagannath Wani</strong></td><td><strong>Independent Director - Chairman</strong></td></tr><tr><td><strong>Dr. Udeeta Tyagi</strong></td><td><strong>Independent Director - Member</strong></td></tr><tr><td><strong>Mr. Mohammad Afzal</strong></td><td><strong>Non-Executive Director - Member</strong></td></tr></tbody></table></div></div></div><!-- DIR 2 --><div class=\"accordion-item\"><h2 class=\"accordion-header\" id=\"headingTwo\"><button class=\"accordion-button collapsed\" type=\"button\" data-bs-toggle=\"collapse\" data-bs-target=\"#dir2\" aria-expanded=\"false\" aria-controls=\"dir2\">\r\n                                                                                       Nomination and Remuneration Committee\r\n                                                                                    </button></h2><div class=\"accordion-collapse collapse\" id=\"dir2\" aria-labelledby=\"headingTwo\" data-bs-parent=\"#accordionExample\"><di