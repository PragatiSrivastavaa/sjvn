/p>\r\n                    <p>\r\n                        Shakti Sadan, SJVN Corporate Office Complex,\r\n                    </p>\r\n                    <p>\r\n                        Shanan, Shimla - 171006, Himachal Pradesh\r\n                    </p>\r\n                    <p>\r\n                        Tel.No. +91 177 2660075\r\n                    </p>\r\n                    <p>\r\n                        Fax No. +91 177 2660071\r\n                    </p>\r\n                    <p>\r\n                        email: investor[dot]relations[at]sjvn[dot]nic[dot]in\r\n                    </p>"
