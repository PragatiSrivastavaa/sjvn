          content:
            value: "<section class=\"about-part\" id=\"about-part\">\r\n    <div class=\"container\">\r\n        <div class=\"row\">\r\n            <div class=\"col-lg-9 col-12\">\r\n                <h2 class=\"subtitle\">\r\n                    Sub-Committees of the Board\r\n\r\n                </h2>\r\n\t\t\t\t<p>Board of Directors has the following sub-committees The compositions of the Sub-Committees of the Board are given below:</p>\r\n                <div class=\"accordion\" id=\"accordionExample\">\r\n                    <!-- DIR 1 -->\r\n                    <div class=\"accordion-item\">\r\n                        <h2 class=\"accordion-header\" id=\"headingOne\">\r\n                            <button class=\"accordion-button collapsed\" type=\"button\" data-bs-toggle=\"collapse\" data-bs-target=\"#dir1\" aria-expanded=\"false\" aria-controls=\"dir1\">\r\n                                                                                       Audit Committee\r\n                                                                                    </button>\r\n                        </h2>\r\n                        <div class=\"accordion-collapse collapse\" id=\"dir1\" aria-labelledby=\"headingOne\" data-bs-parent=\"#accordionExample\">\r\n                            <div class=\"accordion-body\">\r\n                                 <table class=\"table\">\r\n                    <tbody>\r\n                        <tr>\r\n                            <td>\r\n                                <strong>Dr. Shashikant Jagannath Wani</strong>\r\n                            </td>\r\n                            <td>\r\n                                <strong>Independent Director - Chairman</strong>\r\n                            </td>\r\n                        </tr>\r\n                        <tr>\r\n                            <td>\r\n                                <strong>Dr. Udeeta Tyagi</strong>\r\n                            </td>\r\n                            <td>\r\n                                <strong>Independent Director - Member</strong>\r\n                            </td>\r\n                        </tr>\r\n                        <tr>\r\n                            <td>\r\n                                <strong>Mr. Mohammad Afzal</strong>\r\n                            </td>\r\n                            <td>\r\n                                <strong>Non-Executive Director - Member</strong>\r\n                            </td>\r\n                        </tr>\r\n                    </tbody>\r\n </table>\r\n                            </div>\r\n                        </div>\r\n                    </div>\r\n                    <!-- DIR 2 -->\r\n                    <div class=\"accordion-item\">\r\n                        <h2 class=\"accordion-header\" id=\"headingTwo\">\r\n                            <button class=\"accordion-button collapsed\" type=\"button\" data-bs-toggle=\"collapse\" data-bs-target=\"#dir2\" aria-expanded=\"false\" aria-controls=\"dir2\">\r\n                                                                                       Nomination and Remuneration Committee\r\n                                                                                    </button>\r\n                        </h2>\r\n                        <div class=\"accordion-collapse collapse\" id=\"dir2\" aria-labelledby=\"headingTwo\" data-bs-parent=\"#accordionExample\">\r\n                            <div class=\"accordion-body\">\r\n                                                                <table class=\"table\">\r\n                    <tbody>\r\n                        <tr>\r\n                            <td>\r\n                                <strong>Dr. Udeeta Tyagi\r\n\r\n</strong>\r\n                            </td>\r\n                            <td>\r\n                                <strong>Independent Director - Chairperson\r\n\r\n</strong>\r\n                            </td>\r\n                        </tr>\r\n                        <tr>\r\n                            <td>\r\n                                <strong>Dr. Shashikant Jagannath Wani\r\n\r\n</strong>\r\n                            </td>\r\n                            <td>\r\n                                <strong>Independent Director - Member\r\n\r\n</strong>\r\n                            </td>\r\n                        </tr>\r\n                        <tr>\r\n                            <td>\r\n                                <strong>Mr. Mohammad Afzal</strong>\r\n                            </td>\r\n                            <td>\r\n                                <strong>Non-Executive Director - Member\r\n\r\n</strong>\r\n                            </td>\r\n                        </tr>\r\n                    </tbody>\r\n </table>\r\n                            </div>\r\n                        </div>\r\n                    </div>\r\n                    <!-- DIR 3 -->\r\n                    <div class=\"accordion-item\">\r\n                        <h2 class=\"accordion-header\" id=\"headingThree\">\r\n                            <button class=\"accordion-button collapsed\" type=\"button\" data-bs-toggle=\"collapse\" data-bs-target=\"#dir3\" aria-expanded=\"false\" aria-controls=\"dir3\">\r\n                                                                                        Stakeholders Relationship Committee\r\n                                                                                    </button>\r\n                        </h2>\r\n                        <div class=\"accordion-collapse collapse\" id=\"dir3\" aria-labelledby=\"headingThree\" data-bs-parent=\"#accordionExample\">\r\n                            <div class=\"accordion-body\">\r\n                                                                <table class=\"table\">\r\n                    <tbody>\r\n                        <tr>\r\n                            <td>\r\n                                <strong>Dr. Udeeta Tyagi\r\n\r\n</strong>\r\n                            </td>\r\n                            <td>\r\n                                <strong>Independent Director - Chairperson\r\n\r\n</strong>\r\n                            </td>\r\n                        </tr>\r\n                        <tr>\r\n                            <td>\r\n                                <strong>Dr. Shashikant Jagannath Wani\r\n\r\n</strong>\r\n                            </td>\r\n                            <td>\r\n                                <strong>Independent Director - Member</strong>\r\n                            </td>\r\n                        </tr>\r\n                        <tr>\r\n                            <td>\r\n                                <strong>Mr. Ajay Sharma\r\n\r\n</strong>\r\n                            </td>\r\n                            <td>\r\n                                <strong>Director (Personnel) - Member\r\n\r\n\r\n</strong>\r\n                            </td>\r\n                        </tr>\r\n                    </tbody>\r\n </table>\r\n                            </div>\r\n                        </div>\r\n                    </div>\r\n                    <!-- DIR 4 -->\r\n                    <div class=\"accordion-item\">\r\n                        <h2 class=\"accordion-header\" id=\"headingFour\">\r\n                            <button class=\"accordion-button collapsed\" type=\"button\" data-bs-toggle=\"collapse\" data-bs-target=\"#dir4\" aria-expanded=\"false\" aria-controls=\"dir4\">\r\n                                                                                        CSR, SD and R&D Committee\r\n\r\n                                                                                    </button>\r\n                        </h2>\r\n                        <div class=\"accordion-collapse collapse\" id=\"dir4\" aria-labelledby=\"headingFour\" data-bs-parent=\"#accordionExample\">\r\n                            <div class=\"accordion-body\">\r\n                                                                <table class=\"table\">\r\n                    <tbody>\r\n                        <tr>\r\n                            <td>\r\n                                <strong>Dr. Shashikant Jagannath Wani</strong>\r\n                            </td>\r\n                            <td>\r\n                                <strong>Independent Director - Chairman\r\n\r\n</strong>\r\n                            </td>\r\n                        </tr>\r\n                        <tr>\r\n                            <td>\r\n                                <strong>Dr. Udeeta Tyagi</strong>\r\n                            </td>\r\n                            <td>\r\n                                <strong>Independent Director - Member</strong>\r\n                            </td>\r\n                        </tr>\r\n                        <tr>\r\n                            <td>\r\n                                <strong>Mr. Ajay Sharma\r\n\r\n</strong>\r\n                            </td>\r\n                            <td>\r\n                                <strong>Director (Personnel) - Member\r\n\r\n</strong>\r\n                            </td>\r\n                        </tr>\r\n                    </tbody>\r\n </table>\r\n                            </div>\r\n                        </div>\r\n                    </div>\r\n                    <!-- DIR 5 -->\r\n                    <div class=\"accordion-item\">\r\n                        <h2 class=\"accordion-header\" id=\"headingFive\">\r\n                            <button class=\"accordion-button collapsed\" type=\"button\" data-bs-toggle=\"collapse\" data-bs-target=\"#dir5\" aria-expanded=\"false\" aria-controls=\"dir5\">\r\n                                                                                       Risk Management Committee\r\n                                                                                    </button>\r\n                        </h2>\r\n                        <div class=\"accordion-collapse collapse\" id=\"dir5\" aria-labelledby=\"headingFive\" data-bs-parent=\"#accordionExample\">\r\n                            <div class=\"accordion-body\">\r\n                                                                <table class=\"table\">\r\n                    <tbody>\r\n                        <tr>\r\n                            <td>\r\n                                <strong>Dr. Shashikant Jagannath Wani</strong>\r\n                            </td>\r\n                            <td>\r\n                                <strong>Independent Director - Chairman</strong>\r\n                            </td>\r\n                        </tr>\r\n                        <tr>\r\n                            <td>\r\n                                <strong>Dr. Udeeta Tyagi</strong>\r\n                            </td>\r\n                            <td>\r\n                                <strong>Independent Director - Member</strong>\r\n                            </td>\r\n                        </tr>\r\n                        <tr>\r\n                            <td>\r\n                                <strong>Mr. Sushil Sharma\r\n\r\n</strong>\r\n                            </td>\r\n                            <td>\r\n                                <strong>Director (Projects) - Member\r\n\r\n\r\n</strong>\r\n                            </td>\r\n                        </tr>\r\n                    </tbody>\r\n </table>\r\n                            </div>\r\n                        </div>\r\n                    </div>\r\n                    \r\n\r\n                    </div>\r\n                </div>\r\n            </div>\r\n        </div>\r\n    </div>\r\n</section>"
