            alter_text: true
            text: " <div class=\"profile-img\">\r\n{{ field_image_of_directors }} \r\n    </div>\r\n<p>{{ title }} </p>\r\n<p>{{ field_degination }} </p>\r\n{{ view_node }}\r\n{% if field_directors_category is empty %}\r\n<p class=\"directors-message\">The business of the Company is managed by a Board of Directors consisting of Whole Time Directors and Part-Time Directors. SJVN is currently headed by a Chairman and Managing Director (CMD) and Three (3) Functional Directors viz. Director (Personnel), Director (Finance) and Director (Projects). In addition, there are Two (2) Part-Time Directors representing the Government of India and Government of Himachal Pradesh. There are also Two Non-Official Part-Time Independent Directors on the Board of the Company.</p>\r\n  {% endif %}"
