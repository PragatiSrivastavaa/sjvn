          alter:
            alter_text: true
            text: "<div class=\"report-div report-3\">\r\n<ul class=\"result-list\">\r\n\r\n{% set file_url = '' %}\r\n{% set ext = '' %}\r\n\r\n{% if field_file_upload is not empty %}\r\n  {% set file_url = field_file_upload|striptags|trim %}\r\n  {% set ext = file_url|split('.')|last|lower %}\r\n{% elseif field_link is not empty %}\r\n  {% set file_url = field_link|striptags|trim %}\r\n  {% set ext = 'link' %}\r\n{% endif %}\r\n\r\n{% if title %}\r\n<li>\r\n\r\n  <div class=\"message-item-info\">\r\n\r\n    {% if file_url %}\r\n        {% if ext == 'pdf' %}\r\n          <img src=\"/sjvn/sites/default/files/2025-10/pdffileicon.png\"\r\n               width=\"128\" height=\"128\" loading=\"lazy\" alt=\"PDF\">\r\n\r\n        {% elseif ext in ['jpg','jpeg','png','gif','webp'] %}\r\n          <img src=\"/sjvn/sites/default/files/2026-02/Black%20and%20white%20image%20file%20icon.png\"\r\n               width=\"128\" height=\"128\" loading=\"lazy\" alt=\"Image\">\r\n\r\n        {% else %}\r\n          <img src=\"/sjvn/sites/default/files/2026-02/Black%20and%20white%20link%20icon.png\"\r\n               width=\"128\" height=\"128\" loading=\"lazy\" alt=\"Link\">\r\n        {% endif %}\r\n    {% endif %}\r\n\r\n    <h3>{{ title }}</h3>\r\n  </div>\r\n\r\n  {% if file_url %}\r\n  <!-- File Meta -->\r\n  <div class=\"file-meta\">\r\n\r\n    {% if ext != 'link' %}\r\n      <span class=\"file-size\">\r\n        File Size: {{ filesize }}\r\n      </span>\r\n    {% endif %}\r\n\r\n    <span class=\"file-language\">\r\n      {% if ext != 'link' %} | {% endif %}\r\n      {{ langcode }}\r\n    </span>\r\n\r\n  </div>\r\n\r\n  <div class=\"d-flex view-pdf-btn justify-content-center\">\r\n    <a target=\"_blank\"\r\n       href=\"{{ file_url }}\"\r\n       class=\"btn pdf-btn d-flex align-items-center justify-content-center\">\r\n\r\n        {% if ext == 'pdf' %}\r\n          View PDF\r\n        {% elseif ext in ['jpg','jpeg','png','gif','webp'] %}\r\n          View Image\r\n        {% else %}\r\n          View Link\r\n        {% endif %}\r\n    </a>\r\n  </div>\r\n  {% endif %}\r\n\r\n</li>\r\n{% endif %}\r\n\r\n</ul>\r\n</div>\r\n"
