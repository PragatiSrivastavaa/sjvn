          alter:
            alter_text: true
            text: "<div class=\"report-div\">\r\n  <ul>\r\n\r\n    {% set file_url = '' %}\r\n    {% set ext = '' %}\r\n\r\n    {% if field_file_upload is not empty %}\r\n      {% set file_url = field_file_upload|striptags|trim %}\r\n      {% set ext = file_url|split('.')|last|lower %}\r\n    {% elseif field_link is not empty %}\r\n      {% set file_url = field_link|striptags|trim %}\r\n      {% set ext = 'link' %}\r\n    {% endif %}\r\n\r\n    {% if file_url %}\r\n      <li>\r\n\r\n        <p>\r\n          <a href=\"{{ file_url }}\" target=\"_blank\">\r\n\r\n            {% if ext == 'pdf' %}\r\n              <img src=\"/sjvn/sites/default/files/2025-10/pdffileicon.png\"\r\n                   width=\"128\" height=\"128\" loading=\"lazy\" alt=\"PDF\">\r\n\r\n            {% elseif ext in ['jpg','jpeg','png','gif','webp'] %}\r\n              <img src=\"/sjvn/sites/default/files/2026-02/Black%20and%20white%20image%20file%20icon.png\"\r\n                   width=\"128\" height=\"128\" loading=\"lazy\" alt=\"Image\">\r\n\r\n            {% else %}\r\n              <img src=\"/sjvn/sites/default/files/2026-02/Black%20and%20white%20link%20icon.png\"\r\n                   width=\"128\" height=\"128\" loading=\"lazy\" alt=\"Link\">\r\n            {% endif %}\r\n\r\n            {{ title }}\r\n          </a>\r\n        </p>\r\n\r\n        <div>\r\n          <a href=\"{{ file_url }}\" target=\"_blank\" class=\"btn pdf-btn\">\r\n            {% if ext == 'pdf' %}\r\n              View PDF\r\n            {% elseif ext in ['jpg','jpeg','png','gif','webp'] %}\r\n              View Image\r\n            {% else %}\r\n              View Link\r\n            {% endif %}\r\n          </a>\r\n        </div>\r\n\r\n      </li>\r\n    {% endif %}\r\n\r\n  </ul>\r\n</div>\r\n"
